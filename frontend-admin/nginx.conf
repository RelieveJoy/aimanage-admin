server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 前端构建产物是静态文件，开一下压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带 hash 的静态资源可长期缓存（文件名变了内容就变了，缓存安全）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ★ index.html 必须每次回源校验。
    # 不显式声明的话浏览器会启发式缓存，导致重新部署后用户仍加载旧 bundle，
    # 表现为"菜单少了几项 / 点进去白屏"——新版页面看得见但打不开。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # vue-router 用的是 history 模式，刷新子路径时不能 404，
    # 一律回落到 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器。
    # service 名 backend 由 docker compose 的网络 DNS 解析，
    # 所以前端代码里写相对路径 /api/xxx 即可，无需配置后端地址。
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
